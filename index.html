<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
  <style>
    :root {
      --bg: #f4f5fb;
      --card: #ffffff;
      --text: #1f2333;
      --muted: #8a8fa3;
      --border: #e6e8f0;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --danger: #ef4444;
      --success: #10b981;
      --shadow: 0 10px 30px rgba(31, 35, 51, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1117;
        --card: #1a1d27;
        --text: #e8eaf2;
        --muted: #8b90a5;
        --border: #2a2e3b;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f1117;
      --card: #1a1d27;
      --text: #e8eaf2;
      --muted: #8b90a5;
      --border: #2a2e3b;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 16px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    header { margin-bottom: 22px; }
    h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
    .sync { white-space: nowrap; }
    .sync.ok { color: var(--success); }
    .sync.warn { color: #d97706; }

    /* Griglia: testo su tutta la riga, poi data | priorità, categoria | pulsante */
    #task-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
    #task-form > * { min-width: 0; width: 100%; }
    #task-input { grid-column: 1 / -1; }

    #task-input,
    #due-input {
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: transparent;
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #due-input { color-scheme: light dark; }
    #due-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
    }

    #due-input { flex: 1 1 auto; }

    #priority-input {
      flex: 0 1 auto;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #priority-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
    }

    #task-input {
      flex: 1 1 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: transparent;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #task-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
    }

    .add-btn {
      padding: 12px 22px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .add-btn:hover { background: var(--accent-hover); }
    .add-btn:active { transform: scale(0.97); }

    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }
    .filter-btn {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn.active,
    .filter-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    ul { list-style: none; }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
      animation: slideIn 0.25s ease;
    }
    .task:last-child { border-bottom: none; }
    .task.removing { animation: slideOut 0.25s ease forwards; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideOut {
      to { opacity: 0; transform: translateX(30px); }
    }

    .checkbox {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      border: 2px solid var(--border);
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 0.2s;
    }
    .checkbox:hover { border-color: var(--success); }
    .checkbox svg { width: 12px; height: 12px; opacity: 0; transition: opacity 0.2s; }
    .task.completed .checkbox { background: var(--success); border-color: var(--success); }
    .task.completed .checkbox svg { opacity: 1; }

    .task-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .meta { display: flex; flex-wrap: wrap; gap: 6px; }

    /* Barra colorata a sinistra in base alla priorità */
    .task { border-left: 3px solid transparent; }
    .task.p-high   { border-left-color: #ef4444; }
    .task.p-medium { border-left-color: #f59e0b; }
    .task.p-low    { border-left-color: #10b981; }
    .task.completed { border-left-color: var(--border); }

    .priority {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .priority.high   { color: #dc2626; background: rgba(239, 68, 68, 0.12); }
    .priority.medium { color: #d97706; background: rgba(245, 158, 11, 0.14); }
    .priority.low    { color: #059669; background: rgba(16, 185, 129, 0.14); }
    .task.completed .priority { color: var(--muted); background: rgba(138, 143, 163, 0.12); }

    .due {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      color: var(--muted);
      background: rgba(138, 143, 163, 0.12);
    }
    .due.today   { color: #d97706; background: rgba(245, 158, 11, 0.14); }
    .due.overdue { color: var(--danger); background: rgba(239, 68, 68, 0.12); }
    .task.completed .due { color: var(--muted); background: rgba(138, 143, 163, 0.12); }

    .task-text {
      font-size: 1rem;
      word-break: break-word;
      transition: color 0.2s;
    }
    .task.completed .task-text {
      color: var(--muted);
      text-decoration: line-through;
    }

    .delete-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      opacity: 0;
      transition: all 0.2s;
      display: grid;
      place-items: center;
    }
    .task:hover .delete-btn,
    .delete-btn:focus-visible { opacity: 1; }
    .delete-btn:hover { color: var(--danger); background: rgba(239, 68, 68, 0.1); }
    @media (hover: none) { .delete-btn { opacity: 1; } }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 30px 0;
      font-size: 0.95rem;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--muted);
    }
    .clear-btn {
      border: none;
      background: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .clear-btn:hover { color: var(--danger); }

    /* ---- Categorie ---- */
    #category-input {
      flex: 1 1 150px;
      min-width: 0;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: transparent;
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #category-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px;
    }
    /* Su telefono le categorie scorrono in orizzontale invece di occupare molte righe */
    @media (max-width: 560px) {
      .categories {
        flex-wrap: nowrap;
        overflow-x: auto;
        margin: 0 -28px 14px;
        padding: 2px 28px 6px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .categories::-webkit-scrollbar { display: none; }
      .categories > * { flex-shrink: 0; white-space: nowrap; }
    }
    .cat-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      font-size: 0.82rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cat-chip:hover { border-color: var(--muted); }
    .cat-chip.active { border-color: var(--chip-color, var(--accent)); background: var(--chip-bg, rgba(99, 102, 241, 0.1)); }
    .cat-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--chip-color); flex-shrink: 0; }
    .cat-count { color: var(--muted); font-size: 0.75rem; }
    .cat-remove {
      border: none;
      background: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.95rem;
      line-height: 1;
      padding: 0 0 0 2px;
    }
    .cat-remove:hover { color: var(--danger); }

    .new-cat-form {
      display: inline-flex;
      align-items: center;
      border: 1px dashed var(--border);
      border-radius: 999px;
      overflow: hidden;
    }
    .new-cat-form:focus-within { border-color: var(--accent); border-style: solid; }
    .new-cat-btn {
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      width: 30px;
      align-self: stretch;
      cursor: pointer;
    }
    .new-cat-btn:hover { background: var(--accent-hover); }
    .cat-chip.confirm { cursor: default; flex-wrap: wrap; border-color: var(--danger); }
    .confirm-yes, .confirm-no {
      border: none;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 0.78rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .confirm-yes { background: var(--danger); color: #fff; }
    .confirm-no { background: rgba(138, 143, 163, 0.15); color: var(--text); }

    .new-cat {
      width: 140px;
      padding: 5px 10px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.82rem;
      font-family: inherit;
      outline: none;
    }
    

    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      border: none;
      font-family: inherit;
      cursor: pointer;
      color: var(--chip-color);
      background: var(--chip-bg);
    }
    .task.completed .category-badge { color: var(--muted); background: rgba(138, 143, 163, 0.12); }
    .task.completed .category-badge .cat-dot { background: var(--muted); }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>Le mie attività</h1>
      <p class="subtitle"><span id="date"></span> · <span id="sync-status" class="sync">💾 Salvato su questo dispositivo</span></p>
    </header>

    <form id="task-form" autocomplete="off">
      <input id="task-input" type="text" placeholder="Aggiungi una nuova attività..." maxlength="200" aria-label="Nuova attività" />
      <input id="due-input" type="date" aria-label="Scadenza (facoltativa)" title="Scadenza (facoltativa)" />
      <select id="priority-input" aria-label="Priorità" title="Priorità">
        <option value="high">🔴 Alta</option>
        <option value="medium" selected>🟠 Media</option>
        <option value="low">🟢 Bassa</option>
      </select>
      <input id="category-input" type="text" list="category-list" maxlength="30"
             placeholder="Categoria" aria-label="Categoria (facoltativa)" />
      <datalist id="category-list"></datalist>
      <button type="submit" class="add-btn">Aggiungi</button>
    </form>

    <div class="categories" id="categories" aria-label="Categorie"></div>

    <div class="filters" role="group" aria-label="Filtra attività">
      <button class="filter-btn active" data-filter="all">Tutte</button>
      <button class="filter-btn" data-filter="active">Da fare</button>
      <button class="filter-btn" data-filter="completed">Completate</button>
    </div>

    <ul id="task-list"></ul>

    <footer>
      <span id="counter"></span>
      <button class="clear-btn" id="clear-completed">Elimina completate</button>
    </footer>
  </main>

  <script>
    const STORAGE_KEY = "todo-app-tasks";
    const form = document.getElementById("task-form");
    const input = document.getElementById("task-input");
    const dueInput = document.getElementById("due-input");
    const priorityInput = document.getElementById("priority-input");
    const categoryInput = document.getElementById("category-input");
    const categoryList = document.getElementById("category-list");
    const categoriesBar = document.getElementById("categories");
    const CATEGORIES_KEY = "todo-app-categories";
    const CATEGORY_COLORS = ["#6366f1", "#0ea5e9", "#ec4899", "#14b8a6", "#f97316", "#8b5cf6", "#65a30d", "#64748b", "#ca8a04", "#e11d48", "#d946ef", "#78716c"];
    // Categorie iniziali: aggiunte una sola volta a ogni lista (se le elimini non tornano)
    const DEFAULTS_KEY = "todo-app-defaults-v1";
    const DEFAULT_CATEGORIES = [
      { name: "In corso",           color: "#0ea5e9" },
      { name: "Direzione",          color: "#6366f1" },
      { name: "Produzione",         color: "#f97316" },
      { name: "Manutenzione",       color: "#78716c" },
      { name: "Logistica/Acquisti", color: "#14b8a6" },
      { name: "Vendite",            color: "#65a30d" },
      { name: "Amministrazione",    color: "#8b5cf6" },
      { name: "HR",                 color: "#ec4899" },
      { name: "Sicurezza/Qualità",  color: "#e11d48" },
      { name: "Marketing",          color: "#d946ef" },
      { name: "Da archiviare",      color: "#64748b" },
      { name: "Box idea",           color: "#ca8a04" },
    ];
    const list = document.getElementById("task-list");
    const counter = document.getElementById("counter");
    const clearBtn = document.getElementById("clear-completed");
    const filterBtns = document.querySelectorAll(".filter-btn");

    let tasks = loadTasks();
    let currentFilter = "all";
    let currentCategory = null; // null = tutte le categorie
    let categories = loadCategories();
    let defaultsSeeded = false;
    try { defaultsSeeded = localStorage.getItem(DEFAULTS_KEY) === "1"; } catch { /* storage non disponibile */ }

    // Aggiunge le categorie iniziali mancanti (una volta sola). true se ha cambiato qualcosa.
    function seedDefaultCategories() {
      if (defaultsSeeded) return false;
      defaultsSeeded = true;
      try { localStorage.setItem(DEFAULTS_KEY, "1"); } catch { /* storage non disponibile */ }
      DEFAULT_CATEGORIES.forEach(d => {
        if (!categories.some(c => c.name.toLowerCase() === d.name.toLowerCase())) categories.push({ ...d });
      });
      return true;
    }
    if (seedDefaultCategories()) {
      try { localStorage.setItem(CATEGORIES_KEY, JSON.stringify(categories)); } catch { /* storage non disponibile */ }
    }

    document.getElementById("date").textContent = new Date().toLocaleDateString("it-IT", {
      weekday: "long", day: "numeric", month: "long"
    });

    function loadTasks() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch { /* storage non disponibile */ }
      scheduleCloudSave();
    }

    // ---- Categorie: [{ name, color }] salvate a parte ----
    function loadCategories() {
      let saved = [];
      try { saved = JSON.parse(localStorage.getItem(CATEGORIES_KEY)) || []; } catch { saved = []; }
      // recupera eventuali categorie usate dai task ma non in elenco
      tasks.forEach(t => {
        if (t.category && !saved.some(c => c.name === t.category)) {
          saved.push({ name: t.category, color: CATEGORY_COLORS[saved.length % CATEGORY_COLORS.length] });
        }
      });
      return saved;
    }

    function saveCategories() {
      try { localStorage.setItem(CATEGORIES_KEY, JSON.stringify(categories)); } catch { /* storage non disponibile */ }
      scheduleCloudSave();
    }

    // ================= Sincronizzazione cloud =================
    // Su claude.ai i dati di ogni utente stanno in un documento privato
    // (data/users/<id>/state), così restano aggiornati su ogni dispositivo.
    // Se il cloud non è disponibile (file aperto in locale, utente non
    // collegato, permessi di sola lettura) si usa solo il browser.
    const syncEl = document.getElementById("sync-status");
    let cloudRef = null;      // riferimento al documento, se il cloud è attivo
    let cloudReady = false;   // primo dato dal server ricevuto
    let saveTimer = null;
    let saving = false;
    let dirty = false;        // modifiche locali non ancora inviate

    function setSync(text, cls) {
      syncEl.textContent = text;
      syncEl.className = "sync" + (cls ? " " + cls : "");
    }

    function writeLocalCache() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        localStorage.setItem(CATEGORIES_KEY, JSON.stringify(categories));
      } catch { /* storage non disponibile */ }
    }

    function scheduleCloudSave() {
      if (!cloudRef) return;
      dirty = true;
      setSync("⏳ Salvataggio…", "");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(flushCloudSave, 400);
    }

    // Una sola scrittura alla volta; se arrivano altre modifiche nel frattempo,
    // si scrive di nuovo appena finita la precedente.
    async function flushCloudSave() {
      if (!cloudRef || saving || !dirty) return;
      if (!cloudReady) { saveTimer = setTimeout(flushCloudSave, 500); return; }
      saving = true;
      dirty = false;
      try {
        await cloudRef.set({ version: 1, tasks, categories, defaultsSeeded: true, updatedAt: new Date().toISOString() });
        if (!dirty) setSync("☁️ Sincronizzato", "ok");
      } catch (e) {
        const code = e && e.code;
        if (code === "invalid_argument" || code === "not_granted" || code === "revoked" ||
            code === "capability_disabled" || code === "capability_removed") {
          cloudRef = null;
          setSync("💾 Salvato solo su questo dispositivo", "warn");
        } else if (code === "quota_exceeded") {
          setSync("⚠️ Spazio esaurito: elimina qualche task completato", "warn");
        } else {
          dirty = true;
          setSync("⚠️ Non sincronizzato, riprovo…", "warn");
          saveTimer = setTimeout(flushCloudSave, 3000 + Math.random() * 2000);
        }
      } finally {
        saving = false;
        if (dirty && cloudRef) { clearTimeout(saveTimer); saveTimer = setTimeout(flushCloudSave, 400); }
      }
    }

    // I dati del cloud arrivano congelati (sola lettura): vanno sempre copiati,
    // altrimenti non si possono più aggiungere o modificare task e categorie.
    function cloneList(v) {
      return Array.isArray(v) ? JSON.parse(JSON.stringify(v)) : [];
    }

    function applyCloudState(data) {
      tasks = cloneList(data.tasks);
      categories = cloneList(data.categories);
      // Lista nel cloud creata prima delle categorie iniziali: aggiungile ora
      if (!data.defaultsSeeded) {
        defaultsSeeded = false;
        if (seedDefaultCategories()) scheduleCloudSave();
      }
      if (currentCategory && !categories.some(c => c.name === currentCategory)) {
        currentCategory = null;
        categoryInput.value = "";
      }
      writeLocalCache();
      render();
    }

    async function initCloud() {
      if (!window.claude || typeof window.claude.use !== "function") return;
      let db, user;
      try {
        [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      } catch { return; }
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;

      cloudRef = db.doc("data/users/" + uid + "/state");
      setSync("⏳ Caricamento…", "");
      const timeout = setTimeout(() => {
        setSync("⚠️ Cloud non raggiungibile: dati locali", "warn");
      }, 10000);

      cloudRef.onSnapshot(snap => {
        if (!snap.metadata.fromCache) clearTimeout(timeout);

        // Primo dato vero dal server ma con modifiche fatte prima del caricamento:
        // unisci invece di sovrascrivere i dati degli altri dispositivi.
        if (!cloudReady && !snap.metadata.fromCache && snap.exists && dirty) {
          const data = snap.data();
          const cloudTasks = cloneList(data.tasks);
          const cloudCats = cloneList(data.categories);
          const ids = new Set(cloudTasks.map(t => t.id));
          tasks = tasks.filter(t => !ids.has(t.id)).concat(cloudTasks);
          categories = cloudCats.concat(categories.filter(c => !cloudCats.some(k => k.name === c.name)));
          cloudReady = true;
          writeLocalCache();
          render();
          flushCloudSave();
          return;
        }

        // Ignora l'eco delle nostre scritture e i dati arrivati mentre
        // abbiamo modifiche non ancora salvate: vincono quelle.
        if (snap.metadata.hasPendingWrites || dirty || saving) return;

        if (snap.exists) {
          applyCloudState(snap.data());
          if (!snap.metadata.fromCache) { cloudReady = true; setSync("☁️ Sincronizzato", "ok"); }
        } else if (!snap.metadata.fromCache && !cloudReady) {
          // Primo accesso: porta nel cloud i dati già salvati nel browser
          cloudReady = true;
          if (tasks.length || categories.length) {
            dirty = true;
            flushCloudSave();
          } else {
            setSync("☁️ Sincronizzato", "ok");
          }
        }
      }, () => {
        clearTimeout(timeout);
        cloudRef = null;
        setSync("💾 Salvato solo su questo dispositivo", "warn");
      });
    }

    function findCategory(name) {
      const key = name.trim().toLowerCase();
      return categories.find(c => c.name.toLowerCase() === key);
    }

    // Restituisce il nome della categoria, creandola se non esiste
    function ensureCategory(name) {
      name = name.trim().replace(/\s+/g, " ");
      if (!name) return null;
      const existing = findCategory(name);
      if (existing) return existing.name;
      const used = categories.map(c => c.color);
      const color = CATEGORY_COLORS.find(c => !used.includes(c)) || CATEGORY_COLORS[categories.length % CATEGORY_COLORS.length];
      categories.push({ name, color });
      saveCategories();
      return name;
    }

    // Niente confirm(): viene bloccato nelle anteprime in iframe. Conferma in pagina.
    let pendingDelete = null;

    function removeCategory(name) {
      pendingDelete = null;
      categories = categories.filter(c => c.name !== name);
      tasks.forEach(t => { if (t.category === name) t.category = null; });
      if (currentCategory === name) { currentCategory = null; categoryInput.value = ""; }
      saveCategories();
      saveTasks();
      render();
    }

    // Filtra per categoria e la propone come predefinita per i nuovi task
    function setCategoryFilter(name) {
      currentCategory = name;
      categoryInput.value = name || "";
      render();
    }

    function chipStyle(el, color) {
      el.style.setProperty("--chip-color", color);
      el.style.setProperty("--chip-bg", color + "1f");
    }

    function renderCategories() {
      const prevNew = categoriesBar.querySelector(".new-cat");
      const draft = prevNew ? prevNew.value : "";
      const draftFocused = prevNew && document.activeElement === prevNew;
      categoryList.innerHTML = "";
      categories.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c.name;
        categoryList.appendChild(opt);
      });

      categoriesBar.innerHTML = "";

      const all = document.createElement("button");
      all.type = "button";
      all.className = "cat-chip" + (currentCategory === null ? " active" : "");
      all.textContent = "Tutte le categorie";
      all.addEventListener("click", () => setCategoryFilter(null));
      categoriesBar.appendChild(all);

      categories.forEach(c => {
        if (pendingDelete === c.name) {
          const n = tasks.filter(t => t.category === c.name).length;
          const box = document.createElement("div");
          box.className = "cat-chip confirm";
          chipStyle(box, c.color);
          const q = document.createElement("span");
          q.textContent = `Eliminare "${c.name}"?` + (n ? ` (${n} task restano senza categoria)` : "");
          const yes = document.createElement("button");
          yes.type = "button"; yes.className = "confirm-yes"; yes.textContent = "Elimina";
          yes.addEventListener("click", () => removeCategory(c.name));
          const no = document.createElement("button");
          no.type = "button"; no.className = "confirm-no"; no.textContent = "Annulla";
          no.addEventListener("click", () => { pendingDelete = null; render(); });
          box.append(q, yes, no);
          categoriesBar.appendChild(box);
          return;
        }

        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "cat-chip" + (currentCategory === c.name ? " active" : "");
        chipStyle(chip, c.color);
        chip.title = "Filtra per " + c.name;

        const dot = document.createElement("span");
        dot.className = "cat-dot";
        const label = document.createElement("span");
        label.textContent = c.name;
        const count = document.createElement("span");
        count.className = "cat-count";
        count.textContent = tasks.filter(t => t.category === c.name && !t.completed).length || "";

        const x = document.createElement("span");
        x.className = "cat-remove";
        x.setAttribute("role", "button");
        x.setAttribute("aria-label", "Elimina categoria " + c.name);
        x.title = "Elimina categoria";
        x.textContent = "×";
        x.addEventListener("click", e => { e.stopPropagation(); pendingDelete = c.name; render(); });

        chip.append(dot, label, count, x);
        chip.addEventListener("click", () => setCategoryFilter(currentCategory === c.name ? null : c.name));
        categoriesBar.appendChild(chip);
      });

      const addForm = document.createElement("form");
      addForm.className = "new-cat-form";
      addForm.autocomplete = "off";
      const add = document.createElement("input");
      add.className = "new-cat";
      add.placeholder = "Nuova categoria";
      add.maxLength = 30;
      add.enterKeyHint = "done";
      add.setAttribute("aria-label", "Nuova categoria");
      const addBtn = document.createElement("button");
      addBtn.type = "submit";
      addBtn.className = "new-cat-btn";
      addBtn.textContent = "+";
      addBtn.title = "Crea categoria";
      addBtn.setAttribute("aria-label", "Crea categoria");
      addForm.append(add, addBtn);
      addForm.addEventListener("submit", e => {
        e.preventDefault();
        if (ensureCategory(add.value)) {
          add.value = "";
          render();
          categoriesBar.querySelector(".new-cat").focus();
        } else {
          add.focus();
        }
      });
      categoriesBar.appendChild(addForm);
      add.value = draft;
      if (draftFocused) add.focus();
    }

    // "YYYY-MM-DD" -> data locale a mezzanotte (evita slittamenti di fuso orario)
    function parseDate(str) {
      const [y, m, d] = str.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function dueInfo(due) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const days = Math.round((parseDate(due) - today) / 86400000);
      if (days < 0)  return { cls: "overdue", label: days === -1 ? "Scaduta ieri" : `Scaduta da ${-days} giorni` };
      if (days === 0) return { cls: "today", label: "Scade oggi" };
      if (days === 1) return { cls: "", label: "Scade domani" };
      return {
        cls: "",
        label: "Scade il " + parseDate(due).toLocaleDateString("it-IT", { day: "numeric", month: "short", year: days > 300 ? "numeric" : undefined })
      };
    }

    const PRIORITY_LABELS = { high: "Alta", medium: "Media", low: "Bassa" };

    function addTask(text, due, priority, category) {
      tasks.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2), text, due: due || null, priority, category, completed: false });
      saveTasks();
      render();
    }

    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) task.completed = !task.completed;
      saveTasks();
      render();
    }

    function deleteTask(id, element) {
      element.classList.add("removing");
      element.addEventListener("animationend", () => {
        tasks = tasks.filter(t => t.id !== id);
        saveTasks();
        render();
      }, { once: true });
    }

    function render() {
      list.innerHTML = "";
      renderCategories();

      const visible = tasks.filter(t =>
        (currentCategory === null || t.category === currentCategory) &&
        (currentFilter === "all" ? true :
         currentFilter === "active" ? !t.completed : t.completed)
      );

      if (visible.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = tasks.length === 0
          ? "Nessuna attività. Aggiungine una! ✨"
          : "Nessuna attività in questa vista.";
        list.appendChild(empty);
      }

      visible.forEach(task => {
        const li = document.createElement("li");
        li.className = "task" + (task.completed ? " completed" : "");

        const check = document.createElement("button");
        check.className = "checkbox";
        check.setAttribute("aria-label", task.completed ? "Segna come da fare" : "Segna come completata");
        check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
        check.addEventListener("click", () => toggleTask(task.id));

        const span = document.createElement("span");
        span.className = "task-text";
        span.textContent = task.text;

        const body = document.createElement("div");
        body.className = "task-body";
        body.appendChild(span);

        const meta = document.createElement("div");
        meta.className = "meta";

        const cat = task.category && categories.find(c => c.name === task.category);
        if (cat) {
          const cb = document.createElement("button");
          cb.className = "category-badge";
          chipStyle(cb, cat.color);
          cb.title = "Mostra solo " + cat.name;
          const dot = document.createElement("span");
          dot.className = "cat-dot";
          cb.append(dot, document.createTextNode(cat.name));
          cb.addEventListener("click", () => setCategoryFilter(cat.name));
          meta.appendChild(cb);
        }

        if (PRIORITY_LABELS[task.priority]) {
          li.classList.add("p-" + task.priority);
          const pr = document.createElement("span");
          pr.className = "priority " + task.priority;
          pr.textContent = "⚑ " + PRIORITY_LABELS[task.priority];
          meta.appendChild(pr);
        }

        if (task.due) {
          const info = dueInfo(task.due);
          const badge = document.createElement("span");
          badge.className = "due " + info.cls;
          badge.textContent = "📅 " + info.label;
          meta.appendChild(badge);
        }

        if (meta.children.length) body.appendChild(meta);

        const del = document.createElement("button");
        del.className = "delete-btn";
        del.setAttribute("aria-label", "Elimina attività");
        del.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';
        del.addEventListener("click", () => deleteTask(task.id, li));

        li.append(check, body, del);
        list.appendChild(li);
      });

      const remaining = tasks.filter(t => !t.completed).length;
      counter.textContent = `${remaining} ${remaining === 1 ? "attività rimanente" : "attività rimanenti"}`;
      clearBtn.style.visibility = tasks.some(t => t.completed) ? "visible" : "hidden";
    }

    form.addEventListener("submit", e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addTask(text, dueInput.value, priorityInput.value, ensureCategory(categoryInput.value));
      input.value = "";
      dueInput.value = "";
      categoryInput.value = currentCategory || "";
      priorityInput.value = "medium";
      input.focus();
    });

    filterBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        filterBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    clearBtn.addEventListener("click", () => {
      tasks = tasks.filter(t => !t.completed);
      saveTasks();
      render();
    });

    render();
    initCloud();
  </script>
</body>
</html>
